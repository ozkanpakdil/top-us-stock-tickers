name: Post Screener Results to Mastodon

on:
  workflow_call:
    secrets:
      MASTODON_ACCESS_TOKEN:
        required: true
      MASTODON_URL:
        required: true

jobs:
  post_mastodon:
    if: ${{ success() }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build toot from screener results
        id: build
        run: |
          DATE=$(date -u +"%Y-%m-%d")
          SITE="https://ozkanpakdil.github.io/top-us-stock-tickers"

          # --- Breakout Screener (screener 1) ---
          # Columns: symbol,name,industry,close,dayChangePct,volume,volRatio,
          #   sma50,smaLong,at20DayHigh,trendUp,trendSkipped,score,vix,employees
          SCREENER_LATEST="docs/data/screener/LATEST.csv"

          SCREENER_COUNT=0
          SCREENER_TABLE=""
          if [ -f "$SCREENER_LATEST" ]; then
            SCREENER_COUNT=$(($(wc -l < "$SCREENER_LATEST") - 1))
            if [ "$SCREENER_COUNT" -gt 0 ]; then
              # Top 5 by score with day change, vol ratio, employees
              SCREENER_TABLE=$(tail -n +2 "$SCREENER_LATEST" | head -5 | awk -F, '
                function fmtEmp(e) { if (e+0 >= 1000) return sprintf("%dk", e/1000); return e }
                { sym=$1; ind=substr($3,1,14); cls=$4; chg=$5; vr=$7; score=$13; emp=$15
                  chgS = (chg+0 >= 0) ? sprintf("+%.1f%%", chg) : sprintf("%.1f%%", chg)
                  printf "  %-5s %-6s %5s  vol%.1fx  %s emp\n", sym, chgS, score, vr, fmtEmp(emp)
                }
              ')
            fi
          fi

          # --- VCP Screener (screener 2) ---
          # Columns: symbol,name,industry,close,marketCap,aboveSma12m,
          #   aboveSma200,aboveSma150,vcp,contractions,volatilityRatio,pe,
          #   peTrend,fcf,fcfTrend,eps,epsTrend,freeFloatPct,closelyHeldPct,
          #   employees,rulesPassed,rulesTotal,score
          SCREENER2_LATEST="docs/data/screener2/LATEST.csv"

          SCREENER2_COUNT=0
          SCREENER2_VCP_COUNT=0
          SCREENER2_STRONG_COUNT=0
          SCREENER2_TABLE=""
          if [ -f "$SCREENER2_LATEST" ]; then
            SCREENER2_COUNT=$(($(wc -l < "$SCREENER2_LATEST") - 1))
            if [ "$SCREENER2_COUNT" -gt 0 ]; then
              # Count VCP matches (col 9 = vcp == "true")
              SCREENER2_VCP_COUNT=$(tail -n +2 "$SCREENER2_LATEST" | awk -F, '$9=="true"{c++} END{print c+0}')
              # Count strong candidates (rulesPassed >= 7, col 21)
              SCREENER2_STRONG_COUNT=$(tail -n +2 "$SCREENER2_LATEST" | awk -F, '$21+0>=7{c++} END{print c+0}')

              # Show top 5 strong candidates: VCP first, then by score
              # Include VCP flag, rules, score, market cap, employees, key trends
              SCREENER2_TABLE=$(tail -n +2 "$SCREENER2_LATEST" | awk -F, '
                function fmtMc(mc) {
                  if (mc+0 >= 1e12) return sprintf("$%.1fT", mc/1e12)
                  if (mc+0 >= 1e9)  return sprintf("$%.0fB", mc/1e9)
                  if (mc+0 >= 1e6)  return sprintf("$%.0fM", mc/1e6)
                  return sprintf("$%.0f", mc)
                }
                function fmtEmp(e) { if (e+0 >= 1000) return sprintf("%dk", e/1000); return e }
                function trend(t) { if (t=="up") return "↑"; if (t=="down") return "↓"; if (t=="flat") return "→"; return "?" }
                { vcp = ($9=="true") ? "VCP" : "   "
                  printf "  %-5s %s R%2s/12 %5s  %s  %s emp  PE%s FCF%s EPS%s\n", \
                    $1, vcp, $21, $23, fmtMc($5), fmtEmp($20), trend($12), trend($15), trend($18)
                }
              ' | head -5)
            fi
          fi

          # --- Build the toot (Mastodon limit: 500 chars) ---
          TOOT=""
          TOOT+="📊 Stock Screeners — ${DATE}\n\n"
          TOOT+="🔥 Breakout: ${SCREENER_COUNT} hits\n"
          if [ "$SCREENER_COUNT" -gt 0 ]; then
            TOOT+="${SCREENER_TABLE}\n"
          fi
          TOOT+="📉 VCP-2: ${SCREENER2_COUNT} results"
          if [ "$SCREENER2_VCP_COUNT" -gt 0 ]; then
            TOOT+=" · ${SCREENER2_VCP_COUNT} VCP matches"
          fi
          if [ "$SCREENER2_STRONG_COUNT" -gt 0 ]; then
            TOOT+=" · ${SCREENER2_STRONG_COUNT} strong (7+ rules)"
          fi
          TOOT+="\n"
          if [ "$SCREENER2_COUNT" -gt 0 ]; then
            TOOT+="${SCREENER2_TABLE}\n"
          fi
          TOOT+="\n🔗 ${SITE}"

          # Write to env file (multi-line heredoc syntax).
          # printf '%b\n' expands \n and adds a trailing newline so the
          # EOF delimiter is on its own line (required by GitHub Actions).
          echo "TOOT<<EOF" >> $GITHUB_ENV
          printf '%b\n' "$TOOT" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

          # Also save to a file for debugging
          printf '%b\n' "$TOOT" > toot.txt
          echo "Toot length: $(wc -c < toot.txt) chars"
          cat toot.txt

      - name: Send toot to Mastodon
        uses: cbrgm/mastodon-github-action@v2
        with:
          access-token: ${{ secrets.MASTODON_ACCESS_TOKEN }}
          url: ${{ secrets.MASTODON_URL }}
          message: ${{ env.TOOT }}