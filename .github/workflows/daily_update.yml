name: Daily Stock Ticker Update

on:
  schedule:
    # Run weekdays at 02:37 UTC (Mon-Fri), ~11h before the US market opens
    # (9:30 ET = 13:30 UTC in summer DST, 14:30 UTC in winter) and ~6.5h after
    # the previous close (16:00 ET = 20:00 UTC summer / 21:00 UTC winter), so
    # daily bars are always finalized. It also sits before the 04:00 ET
    # pre-market start, so quotes are clean regular-session closes.
    # Why 02:37 and not 10:00 on the hour:
    #  1. GitHub's scheduler queues every cron set at exactly :00 — observed
    #     delays of 1-3+ hours pushed the old 10:00 run into/after market hours.
    #     Odd minutes (and the middle of the night UTC) are far less congested.
    #  2. The huge buffer means even an extreme multi-hour scheduler delay
    #     still lands before the open, year-round (both US and UK clock changes).
    - cron: '37 2 * * 1-5'
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

# Avoid concurrent Pages deploys.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        # Full history (fetch-depth: 0): the screener walks the git log of
        # tickers/all.csv to rebuild the close+volume time series.
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Run update script
        # Generates the daily CSV snapshots (one daily snapshot of every US
        # ticker, with OHLC), committed to main so the git history of
        # tickers/all.csv is the source of truth for the historical archive.
        run: bun run src/update_tickers.ts

      - name: Run daily screener
        # Scans all US stocks for breakout candidates (trend + volume + new
        # highs + VIX<21) from the git history of tickers/all.csv, writes
        # docs/data/screener/{LATEST,hits_log,watchlist_15,conviction_30}.csv
        # (committed below, published to the Pages site). hits_log is the
        # append-only screener time series.
        run: bun run src/screener.ts

      - name: Run VCP screener-2
        # Scans all US stocks for Minervini-style volatility contraction
        # patterns with fundamental confirmation (12 rules). Writes
        # docs/data/screener2/{LATEST,hits_log}.csv and rss.xml.
        run: bun run src/screener2.ts

      - name: Run premovers predictor
        # Ranks every eligible stock by its odds of a >= +20% NEXT-day move
        # (trained walk-forward on the git history; catches names a day before
        # they explode, VEEA-style). Writes docs/data/screener/premovers.csv
        # (today's candidates) and premovers_log.csv (append-only record).
        run: bun run src/premovers.ts

      - name: Commit and push changes
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"

          # Add the committed-to-main outputs: ticker CSVs, by-industry, the
          # small docs/data indexes (manifest.json + tickers.json), and the
          # daily screener outputs (docs/data/screener/*.csv, published to the
          # Pages site).
          git add tickers/ by_industry/ docs/data/

          # Check for changes before committing to avoid empty commit errors
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Auto-update ticker lists: $(date -u)"
            git push
          fi

      - name: Upload Pages artifact
        # Upload docs/ (with freshly generated CSVs) and deploy to Pages.
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4

